<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Scheme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
  <div class="container mt-5">
    <h2>Edit Scheme</h2>
    <form method="POST">
      <input type="text" name="name" class="form-control" required>
      <input type="text" name="category" class="form-control" required>
      <input type="text" name="eligibility" class="form-control" required>
      <input type="text" name="benefits" class="form-control" required>
      <input type="url" name="application_link" class="form-control" required>
      <input type="hidden" name="id" value="{{ scheme.id }}">
      <div class="mb-3">
        <label class="form-label">Scheme Name</label>
        <input type="text" name="name" class="form-control" value="{{ scheme.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select" required>
          <option value="Education" {% if scheme.category == 'Education' %}selected{% endif %}>Education</option>
          <option value="Health" {% if scheme.category == 'Health' %}selected{% endif %}>Health</option>
          <option value="Employment" {% if scheme.category == 'Employment' %}selected{% endif %}>Employment</option>
          <option value="Agriculture" {% if scheme.category == 'Agriculture' %}selected{% endif %}>Agriculture</option>
          <option value="Women Empowerment" {% if scheme.category == 'Women Empowerment' %}selected{% endif %}>Women Empowerment</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Eligibility</label>
        <textarea name="eligibility" class="form-control" required>{{ scheme.eligibility }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Benefits</label>
        <textarea name="benefits" class="form-control" required>{{ scheme.benefits }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Application Link</label>
        <input type="url" name="application_link" class="form-control" value="{{ scheme.application_link }}" required>
      </div>
      <button type="submit" class="btn btn-success">Update Scheme</button>
    </form>
  </div>
</body>
</html>
